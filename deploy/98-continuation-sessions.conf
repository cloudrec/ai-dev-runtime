# Continuation watchdog — managed-auto sessions, ENABLED by owner approval 2026-08-27.
#
# Owner policy for this chat/project: autonomously continue exactly these two
# active sessions so they no longer need a manual ping when they go idle:
#     owner-os-opus-windows, gaika-server
#
# WHY THIS KNOB AND NOT `mode: auto` IN config/agent_orchestrator.yaml:
# `mode: auto` is read by six subsystems - the orchestrator (auto-advance,
# advance_phases, context rotation/clear), agent_watcher, agent_supervisor
# (auto-resolving permission prompts), discovery, AND the continuation watchdog.
# Setting it would grant far more autonomy than was approved. This variable is
# read ONLY by core/agent_continuation_watchdog.py:eligible_sessions(), so the
# grant is exactly "continue an idle agent with a documented safe next step"
# and nothing else.
#
# Every existing protection stays in force: the watchdog proves each submission
# (submitted + pane changed + prompt consumed + conversation modified + state
# transitioned), never repeats a continuation (durable idempotency by target /
# conversation / step hash), never creates an agent, and REFUSES to submit
# destructive, live, payment, credential or publication text - that is surfaced
# to the owner, never auto-sent.
#
# Deliberately NOT widened to payment / infra / other sessions.
#
# Reversible: delete this file + `systemctl daemon-reload` + restart the service
# to return these two sessions to observe-only.
[Service]
Environment=CONTINUATION_WATCHDOG_SESSIONS=owner-os-opus-windows,gaika-server
