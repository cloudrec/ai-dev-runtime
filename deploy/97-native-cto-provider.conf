# Native Owner OS GPT CTO provider — CANARY (pairs with 96-native-owner-os-canary.conf).
# Sorts after 96 so its delivery mode wins. Non-secret config only: the key lives in
# /etc/ai-runtime/cto-openai.env (root 0600, optional "-" => absent key = missing_secret,
# decisions wait as waiting_provider). Installed/removed by tools/native_cto_key.sh.
# native_controller delivery = advice stays in native_outbox for a controller Claude session;
# the server never types it into an agent.
[Service]
Environment=OWNER_OS_CTO_PROVIDER=openai
Environment=OWNER_OS_CTO_MODEL=gpt-5.6-sol
Environment=OWNER_OS_CTO_DELIVERY_MODE=native_controller
EnvironmentFile=-/etc/ai-runtime/cto-openai.env
