# Native Owner OS CTO = an already-authenticated Claude Code session (subscription): NO API key,
# no metered spend, no new agent. ALTERNATIVE to 97-native-cto-provider.conf (one at a time).
# Rendered by `tools/native_cto_key.sh session --controller T --workers a,b`; the placeholders
# below are filled and validated there (controller not a worker, never payorch-ha-fresh, at
# least one explicit worker). Independent oversight: the controller only receives CTO
# requests, workers only receive advice. Sorts after 96, so its worker scope wins.
[Service]
Environment=OWNER_OS_CTO_PROVIDER=claude_session
Environment=OWNER_OS_CTO_CONTROLLER=__CONTROLLER__
Environment=NATIVE_OWNER_OS_AGENTS=__WORKERS__
Environment=OWNER_OS_CTO_DELIVERY_MODE=agent_control
