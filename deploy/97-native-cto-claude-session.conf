# Native Owner OS CTO = an already-authenticated Claude Code session (subscription): NO API key,
# no metered spend, no new agent. ALTERNATIVE to 97-native-cto-provider.conf (install one).
# Requests and advice are both typed by the canary-scoped agent_control delivery, so the
# controller must be inside NATIVE_OWNER_OS_AGENTS (96) and is never payorch-ha-fresh.
# Controller choice is an owner decision; the canary default is aes-canary reviewing itself.
[Service]
Environment=OWNER_OS_CTO_PROVIDER=claude_session
Environment=OWNER_OS_CTO_CONTROLLER=aes-canary:0.0
Environment=OWNER_OS_CTO_DELIVERY_MODE=agent_control
