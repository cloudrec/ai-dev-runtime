# Tech lead hears every non-payment agent with an authoritative identity (session:w.p
# with a live pane and known cwd); payment work never (core.wake_bridge.offer_allowed).
# The explicit list keeps targets without a pane on this socket (fc-* projects).
# Rollback: deploy/adaptive_offer/rollback.sh <backup dir>.
[Service]
Environment=WAKE_BRIDGE_OFFER=nonpayment
Environment=WAKE_BRIDGE_ONLY_AGENTS=owner-os-supervisor-clean,owneros-taskboard-taskboard,fc-*
