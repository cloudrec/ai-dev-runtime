# The tech lead hears every non-payment agent on authoritative identity: its live pane's
# cwd, else the identity recorded when the event was decided (Full Cycle projects by their
# root under /opt/fc-projects). Payment work never; an unknown WAKE_BRIDGE_OFFER offers
# nothing (core.wake_bridge.offerable). The two names below have no pane of their own.
# Rollback: deploy/adaptive_offer/rollback.sh <backup dir>.
[Service]
Environment=WAKE_BRIDGE_OFFER=nonpayment
Environment=WAKE_BRIDGE_ONLY_AGENTS=owner-os-supervisor-clean,owneros-taskboard-taskboard
