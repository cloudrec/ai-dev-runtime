# Autonomous Agent Orchestrator V1 — session policy.
#
# DESCRIPTIVE + POLICY. The orchestrator only ever supervises EXISTING tmux
# agents; it never creates a session or a duplicate. `mode` controls autonomy:
#   auto    — auto-continue provably-safe local prompts (structured policy);
#             leave unknown/consequential prompts for the owner.
#   hold    — monitor only; never auto-resolve or advance (owner-driven).
#   monitor — observe + record state; no resolution (default for unlisted).
#
# Rollout: SEO + JobHunter first (auto). Others stay monitor/hold until canaries
# pass. `advance_phases` (auto task dispatch across approved phases) is OFF by
# default — the orchestrator continues an agent by unblocking safe prompts, not
# by inventing or auto-sending new task text.
version: 1
allowed_roots:
  - /opt
  - /root/ai-dev-runtime
  - /root/safeguard-remote-agent

sessions:
  seo-audit:
    project: seo
    root: /opt/seo
    approved_goal: "SEO Stage 4 — AI Marketing Distribution OS (Telegram + WordPress distribution)"
    mode: auto
    # Live context-rotation acceptance (2026-07-22): scoped opt-in for THIS agent
    # only. The autonomous /clear fires solely when context reaches threshold AND
    # the agent is stably idle at a verified safe boundary with a fresh exact
    # handoff and this exact approved task still remaining.
    context_rotate: true
    handoff_path: /opt/seo/reports/CONTEXT_HANDOFF.md
    # Narrow routine-push auto-approval (managed approved project): a routine
    # current-branch push to this exact existing upstream is auto-approved; any
    # unusual form (force/tags/delete/other-branch/protected/mismatch/…) stops for
    # the owner with the exact reason. Never broadens to `git *`.
    auto_push: true
    push_repo: github.com/cloudrec/seo
    protected_branches: [main, master]
    # Narrow service-ops auto-approval (owner opt-in 2026-07-22): systemctl RESTART
    # of allowlisted services only + task-scoped docker compose build/up/create/
    # restart. Never stop/disable/down/prune/rm. Rollback evidence + health check.
    service_ops: true
    services: [ai-runtime.service, seo-backend, seo-frontend]
    compose_file: /opt/seo/docker-compose.yml
    task_scoped_services: [backend, frontend]
    container_names: {backend: seo-backend-1, frontend: seo-frontend-1}
    active_task_id: part-f-paid-growth-os
    active_task_title: "Part F — Paid Growth OS foundation + campaign studio"
    # Owner-declared COMPLETE (2026-07-22): completed/deployed/pushed at a clean
    # boundary; no remaining approved INTERNAL work — external inputs only. Surfaces
    # the genuine SEO Part F completion exactly once (task_completed_waiting_external).
    active_task_completed: true
    external_inputs_only: true
    active_task_result: "completed, deployed, pushed; no remaining approved internal work; external inputs only"
    # Cross-phase auto-progress is ENABLED, but a phase is dispatched ONLY when its
    # exact owner-approved text is recorded below (approved_task_text). No text ⇒
    # no dispatch (never invent direction). acceptance markers additionally block
    # advancement past a failed/duplicate phase.
    advance_phases: true
    phases:
      - id: stage-4
        title: "Telegram + WordPress distribution"
        acceptance:
          must_not_contain: ["FAILED", "acceptance failed", "duplicate_created=true"]
        # approved_task_text: "<owner records exact next-phase text here to enable dispatch>"
      - id: stage-5
        title: "LinkedIn + Pinterest"
        # approved_task_text intentionally absent — must be owner-recorded, and must
        # NOT trigger external publication or premium activation.

  job:
    project: jobhunter-ai
    root: /opt/jobhunter-ai
    approved_goal: "JobHunter Monetization V1"
    mode: auto
    advance_phases: true
    phases:
      - id: monetization-v1
        title: "JobHunter Monetization V1"
        acceptance:
          must_not_contain: ["FAILED", "acceptance failed"]
        # approved_task_text intentionally absent — owner-recorded only; no premium activation.

  safeguard:
    project: safeguard
    root: /root/safeguard-remote-agent
    mode: hold
    hold_state: externally_blocked
    note: "Externally blocked on vendor verification key — monitor only, never advance."

  polyinput:
    project: polyinput
    root: /opt/polyinput
    mode: hold
    hold_state: waiting_owner
    note: "Waiting for owner testing — monitor only, never advance."

  arbitrage2-opus:
    project: arbitrage2
    root: /opt/arbitrage2
    approved_goal: "arbitrage2 fault-matrix extension + replay harness (paper/analysis + code/tests only)"
    mode: auto
    # Continuation watchdog opt-in: submit the agent's already-typed SAFE next step
    # and verify it lands; proactive_continue lets the watchdog deliver the documented
    # safe step when the input line is empty (bounded by CONTINUATION_WATCHDOG_MAX_PER_CONV).
    proactive_continue: true
    safe_continuation: "Continue with the fault-matrix extension and replay harness"
    # BOUNDED SCOPE (owner-approved 2026-08-03): analysis + code/tests strictly inside
    # /opt/arbitrage2. Never start/stop trading services, never touch exchange
    # credentials/secrets/.env, never place live/mainnet orders, never push/publish.
    # advance_phases OFF and no auto_push/service_ops → those stay owner-gated. The
    # watchdog additionally refuses any destructive/live/payment/credential/publish text.
    advance_phases: false
