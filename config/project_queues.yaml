# Durable per-project execution queues for the Phase 3 continuation governor.
#
# The governor NEVER invents work. It may only submit something already queued in the pane
# by the owner, or advance to an item that is written down in these sources. If a declared
# source is missing, that is an owner blocker naming the missing file — not licence to
# improvise.
#
# `authoritative_pointer` names the file whose "execute next" section defines the current
# item. `required_sources` must ALL exist for queue-driven advancement to be allowed.

# PROJECT-ROLE ISOLATION (owner requirement 2026-08-05).
# `role` and `allowed_scopes` bound what a project may EVER be asked to do. The governor
# only continues work grounded in that project's own durable queue, and cross-project work
# is rejected with an explicit blocker rather than silently skipped. Payment can never be
# handed JobHunter product work; MESS can never receive unrelated tasks; arbitrage2 stays
# paper-only.

projects:
  mess-qa-automation:0.0:
    project: mess
    role: messenger_ui_redesign
    allowed_scopes: [mess_ui, mess_qa, mess_local_test]
    forbidden_scopes: [payment, trading, jobhunter, publication, deploy]
    cwd: /opt/mess
    required_sources:
      - /opt/mess/design/v1/REDESIGN_EXECUTION_QUEUE.md
      # /opt/mess/reports/PROJECT_STATE.md removed 2026-08-15: the mess agent
      # reorganized its reports and the file no longer exists on disk. The
      # authoritative pointer below is the durable queue (see note), so the
      # governor loses nothing; a dangling required_source only fails the
      # config-coherence test and every runtime job gated on the repo suite.
    # The owner's agent created the durable machine-readable queue during V8; it — not
    # PROJECT_STATE alone — is authoritative.
    authoritative_pointer: /opt/mess/design/v1/REDESIGN_EXECUTION_QUEUE.md
    pointer_section: ""
    # An OWNER-typed paste already sitting in the input line is the owner's own
    # instruction; submitting it restores their intent rather than inventing work. This
    # is what the 2026-08-05 37-minute stall was. Enabled here deliberately and audited;
    # see the limitation note in the phase 3 report.
    submit_owner_queued_paste: true
    # Hold LIFTED 2026-08-06 on explicit owner instruction: the approved owner-queued design
    # task sitting in this pane must be submitted. Note that re-enabling governance also
    # re-enables queue advancement, so stage_09 becomes deliverable again once its stage is
    # current — that is a consequence of lifting the hold, not a separate decision.
    enabled: true

  arbitrage2-opus:0.0:
    project: arbitrage2
    role: paper_only_research
    allowed_scopes: [arb_paper, arb_audit]
    forbidden_scopes: [live_trading, orders, venue_adapters, keys, payment, jobhunter, mess_ui]
    cwd: /opt/arbitrage2
    # The owner named a durable queue source for MESS only. Nothing is declared here
    # because I do not know which arbitrage2 report is authoritative, and inventing a path
    # is exactly what this phase forbids. Queue-driven advancement therefore stays off for
    # this project until the owner names the file; detection and refusals still apply.
    required_sources: []
    authoritative_pointer: ""
    pointer_section: ""
    submit_owner_queued_paste: false
    # OWNER PAUSE (2026-08-05): "Do not work on Arbitrage2 while its owner pause is active."
    # A pause on a project has to extend to the autonomous system acting on it — the
    # autopilot was touching this pane on every 60s tick, which IS working on it. Governance
    # is off here, and the target is also removed from CONTROL_PLANE_CANARY_AGENTS so no
    # actuation is possible even if this flag were flipped back. Re-enable only on an
    # explicit owner instruction lifting the pause.
    enabled: false

  cp-canary:0.0:
    project: cp-canary
    role: disposable_canary
    allowed_scopes: [canary_file, canary_report]
    forbidden_scopes: [payment, trading, jobhunter, mess_ui, publication, deploy]
    cwd: /root/cp-canary-v2
    # deterministic acceptance harness (owner-authorised 2026-08-05): file/report only
    required_sources:
      - /root/cp-canary-v2/CANARY_EXECUTION_QUEUE.md
    authoritative_pointer: /root/cp-canary-v2/CANARY_EXECUTION_QUEUE.md
    pointer_section: ""
    submit_owner_queued_paste: false
    enabled: true

# payment:0.0 is deliberately absent and must stay absent.
